    <!-- PACKING TAB -->
    <div class="tab-panel" id="tab-packing">
      <div class="section-row packing-heading-row">
        <h3 class="section-title" style="font-size:1.5rem;margin:0;transform:rotate(-0.5deg)">Packing List</h3>
        <span class="badge badge-info" id="packing-progress-badge" style="transform:rotate(1deg)">0/0 packed</span>
      </div>
      <div class="packing-add-bar" style="display:flex;gap:10px;align-items:flex-end;margin-bottom:16px;">
        <div style="flex:1;"><label class="input-label">ITEM</label><input id="pack-input" class="journal-input"
            type="text" placeholder="Sunscreen, passport, charger..."
            onkeydown="if(event.key==='Enter')addPackItem()" /></div>
        <button class="btn btn-primary" onclick="addPackItem()" style="font-size:0.78rem;padding:8px 14px;">+
          Add</button>
      </div>
      <div id="packing-list"></div>
    </div>
