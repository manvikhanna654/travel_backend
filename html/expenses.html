    <!-- EXPENSES TAB -->
    <div class="tab-panel active" id="tab-expenses">
      <div class="expense-layout">
        <div>
          <div class="section-row" style="margin-bottom:12px;">
            <h3 class="section-title" style="font-size:1.5rem;margin:0;transform:rotate(0.5deg)">Loose Receipts</h3>
            <button class="btn btn-primary" onclick="openModal('modal-add-expense')"
              style="font-size:0.78rem;padding:8px 14px;">+ Add Expense</button>
          </div>
          <div id="budget-bar-wrap" style="display:none;margin-bottom:16px;">
            <div style="display:flex;justify-content:space-between;"><span class="input-label">BUDGET
                PROGRESS</span><span class="input-label" id="budget-label"></span></div>
            <div class="budget-bar-bg">
              <div class="budget-bar-fill" id="budget-bar-fill" style="width:0%"></div>
            </div>
          </div>
          <div class="receipts-list" id="receipts-list">
            <p style="color:var(--on-surface-variant);font-size:0.85rem;padding:12px 0;">No expenses yet - add your
              first receipt!</p>
          </div>
        </div>
        <div>
          <div class="spending-breakdown-card">
            <!-- Top Right Polaroid Photo -->
            <div class="breakdown-polaroid">
              <img src="https://images.unsplash.com/photo-1534351735168-2f8b31a5b0ae?w=200&q=75" alt="La Rambla" />
              <span class="breakdown-polaroid-caption">La Rambla 🥳</span>
            </div>

            <!-- Section Title with Wavy Underline -->
            <div class="breakdown-header">
              <h3 class="breakdown-title">Spending<br>Breakdown</h3>
              <svg class="wavy-underline" viewBox="0 0 200 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 6C15 2 28 10 41 6C54 2 67 10 80 6C93 2 106 10 119 6C132 2 145 10 158 6C171 2 184 10 198 6"
                  stroke="#C85A44" stroke-width="3" stroke-linecap="round" />
              </svg>
            </div>

            <!-- Donut Chart & Center Sticker -->
            <div class="chart-wrap" id="chart-wrap-container">
              <canvas id="expense-chart" width="160" height="160"></canvas>
              <div class="chart-center-sticker" id="chart-center-text">
                <span class="center-label">total</span>
                <span class="center-val" id="chart-center-val">&#8377;0</span>
              </div>
            </div>

            <!-- Legend Box -->
            <div class="receipt-legend-box">
              <div class="legend-box-header">✦ &nbsp; EXPENSE BREAKDOWN &nbsp; ✦</div>
              <div id="category-summary"></div>
              <div class="legend-total-row">
                <span class="legend-total-label">TOTAL</span>
                <span class="legend-dots"></span>
                <span class="legend-total-val" id="legend-total-val">&#8377;0</span>
              </div>
            </div>

            <div class="chart-hover-hint">hover segments to explore &rarr;</div>

            <!-- Decorative Washi Tape on Bottom Left -->
            <div class="washi-tape washi-green breakdown-washi"></div>
          </div>

          <!-- CUTE TRAVEL SCRAPBOOK MEMORY CARD (Fills empty space) -->
          <div class="cute-memory-card">
            <div class="washi-tape washi-orange memory-washi"></div>
            <div class="cute-memory-content">
              <div class="cute-polaroid-frame">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=300&q=75" alt="Beach Sunset" />
                <span class="cute-polaroid-caption">Wanderlust 🌅</span>
              </div>
              <div class="cute-memory-text">
                <span class="cute-stamp-badge">📍 PASSPORT APPROVED</span>
                <h4 class="cute-memory-quote">&ldquo;Memories over things ✈️✨&rdquo;</h4>
                <p class="cute-memory-sub">Collecting moments &amp; sharing adventures together!</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
