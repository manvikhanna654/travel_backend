<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripSplit — Your travel journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-grain" aria-hidden="true"></div>
  <main class="auth-page">
    <a class="auth-brand" href="index.html"><span>✈</span> Trip<span>Split</span></a>
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-card__art" role="img" aria-label="Illustrated mountain meadow with wildflowers"><div class="auth-card__overlay"></div><div class="auth-card__note">your next<br>chapter starts here</div><div class="auth-card__line"></div></div>
      <div class="auth-card__form-wrap">
        <p class="eyebrow">YOUR TRAVEL JOURNAL</p>
        <h1 id="auth-title">Welcome back.</h1>
        <p class="auth-subtitle" id="auth-subtitle">Log in to pick up where you left off.</p>
        <div class="auth-switcher" role="tablist" aria-label="Account access"><button class="is-active" id="login-tab" type="button" role="tab" aria-selected="true">Log in</button><button id="signup-tab" type="button" role="tab" aria-selected="false">Sign up</button></div>
        <div class="auth-social" aria-label="Social sign in options"><button type="button" aria-label="Continue with Google"><b>G</b><span>Google</span></button><button type="button" aria-label="Continue with Facebook"><b>f</b></button><button type="button" aria-label="Continue with X"><b>𝕏</b></button></div><div class="auth-divider"><span>or</span></div>
        <form id="auth-form" novalidate>
          <label class="auth-field auth-name-field"><span>Your name</span><input id="auth-name" type="text" autocomplete="name" placeholder="Amelia Moss"></label>
          <label class="auth-field"><span>Email address</span><input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
          <label class="auth-field"><span>Password</span><input id="auth-password" type="password" autocomplete="current-password" placeholder="At least 6 characters" minlength="6" required></label>
          <label class="auth-field auth-confirm-field"><span>Confirm password</span><input id="auth-confirm" type="password" autocomplete="new-password" placeholder="Repeat your password"></label>
          <label class="auth-terms"><input id="auth-terms" type="checkbox"><span>I agree to the terms of service and privacy policy.</span></label>
          <p class="auth-error" id="auth-error" role="alert" aria-live="polite"></p>
          <button class="auth-submit" id="auth-submit" type="submit">Log in <span>→</span></button>
        </form>
        <p class="auth-note">Local demo account — your journal stays in this browser.</p>
        <a class="back-link" href="index.html">← Back to the landing page</a>
      </div>
    </section>
    <p class="auth-footer">Made with <span>♥</span> for travelers</p>
  </main>
  <script src="auth.js"></script>
</body>
</html>
