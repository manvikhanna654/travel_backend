<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Stage 1 is kept in its own folder; this entry point makes it the visible main page. -->
  <script>
    const appMode = new URLSearchParams(window.location.search).has('app');
    const signedIn = Boolean(localStorage.getItem('currentUser') && localStorage.getItem('authToken'));
    if (!appMode || !signedIn) window.location.replace('stage-1/index.html');
  </script>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>TripSplit - Share Memories &amp; Expenses</title>
  <meta name="description"
    content="TripSplit: A collaborative travel planner for sharing expenses, itineraries, and memories with your group." />
  <link
    href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Caveat:wght@400..700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <!-- Cache-bust feature styles so fixes to the trip shell reach existing sessions. -->
  <link rel="stylesheet" href="styles/features.css?v=weather-fix-2" />
</head>

<body>

  <div id="app-shell" aria-live="polite"><p class="shell-loading">Loading your travel journal...</p></div>

  <script src="app-shell.js?v=9"></script>
</body>

</html>
